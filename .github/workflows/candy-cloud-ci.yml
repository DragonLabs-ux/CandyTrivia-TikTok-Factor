name: Candy Cloud Safety Tests

on:
  pull_request:
  push:
    branches: [main, codex/python-cloud-autopilot]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test duplicate protection, timeouts, import, and activation gates
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit-content

  render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/python-cloud-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CANDY_PUBLISHING_DISABLED: '1'
      OPENAI_IMAGES_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-cloud.txt
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install --yes ffmpeg
      - name: Render and validate a production video without credentials
        run: python candy_cloud.py --mode render-only --post candy-premium-2026-09:010
